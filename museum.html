<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>お道具の美術館</title>
  <style>
    :root {
      --wall: #1d1916; --wall-2: #26211d; --frame: #6a5238; --frame-2: #3a2c1e;
      --label: #f4efe4; --ink: #2b2622; --muted: #8d8275; --kin: #c9a24a; --matcha: #7f9a3c;
      --mincho: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;
      --gothic: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--wall); color: #e9e2d4; font-family: var(--gothic); }
    a { color: var(--kin); }
    header {
      text-align: center; padding: 48px 20px 28px;
      background: radial-gradient(ellipse at 50% 0%, #3a3128 0%, var(--wall) 70%);
    }
    header .back { position: absolute; left: 20px; top: 16px; font-size: 13px; }
    header h1 { margin: 0; font-family: var(--mincho); font-size: 40px; letter-spacing: 0.3em; font-weight: 600; }
    header p { margin: 10px 0 0; color: var(--muted); letter-spacing: 0.1em; }
    #error { background: #5a2018; color: #fff; padding: 10px 20px; }

    section.room { padding: 30px 32px 56px; border-top: 1px solid #332b24; }
    .room h2 { font-family: var(--mincho); font-size: 22px; letter-spacing: 0.15em; margin: 0 0 6px; color: #f0e6d2; }
    .room .intro { color: var(--muted); margin: 0 0 26px; font-size: 14px; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 40px 28px; }

    .exhibit { cursor: pointer; display: flex; flex-direction: column; align-items: center; }
    /* スポットライト */
    .spot {
      width: 100%; aspect-ratio: 1 / 0.9; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 35%, rgba(255, 236, 200, 0.16) 0%, rgba(255, 236, 200, 0.04) 45%, transparent 70%);
    }
    .frame {
      background: #d6cf96; padding: 14px; display: flex; gap: 10px; align-items: flex-end;
      border: 8px solid var(--frame); outline: 2px solid var(--frame-2);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.6), inset 0 0 0 2px #b8b06c;
      transition: transform 0.2s;
    }
    .exhibit:hover .frame { transform: translateY(-4px); }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
    /* 作品の名札 */
    .plate {
      margin-top: 18px; background: var(--label); color: var(--ink); padding: 10px 14px; width: 88%;
      border-radius: 2px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.45);
    }
    .plate .name { font-family: var(--mincho); font-size: 19px; font-weight: 600; letter-spacing: 0.1em; }
    .plate .yomi { font-size: 11px; color: #7a7066; margin-left: 6px; letter-spacing: 0.1em; }
    .plate .motif { font-size: 12px; line-height: 1.6; margin-top: 4px; color: #4a423a;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* 特別展示 */
    .special-card { background: var(--wall-2); border: 1px solid #3a3129; padding: 18px 20px; margin-bottom: 26px; }
    .special-card h3 { font-family: var(--mincho); margin: 0 0 12px; font-size: 18px; color: #f0e6d2; }
    .special-card .views { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-end; }
    .special-card figure { margin: 0; }
    .special-card figcaption { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .special-card .caps { display: flex; font-size: 12px; color: #d8cfbe; }
    .special-card .caps span { flex: 1; text-align: center; }
    .special-card p { font-size: 13px; line-height: 1.7; color: #d8cfbe; margin: 12px 0 0; }

    /* 解説（クリックで開く） */
    dialog {
      border: none; padding: 0; max-width: 820px; width: 92vw; background: var(--label); color: var(--ink);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
    }
    dialog::backdrop { background: rgba(10, 8, 6, 0.75); }
    .d-wrap { display: grid; grid-template-columns: auto 1fr; }
    .d-art { background: #d6cf96; padding: 24px; display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center; }
    .d-art figure { margin: 0; text-align: center; }
    .d-art figcaption { font-size: 11px; color: #5a5040; margin-top: 4px; }
    .d-text { padding: 26px 30px; }
    .d-text h2 { font-family: var(--mincho); font-size: 30px; margin: 0; letter-spacing: 0.12em; }
    .d-text .yomi { color: #7a7066; letter-spacing: 0.2em; font-size: 13px; }
    .d-text .cat { display: inline-block; margin-top: 6px; font-size: 11px; color: #fff; background: var(--matcha); padding: 2px 8px; border-radius: 10px; }
    .d-text h3 { font-family: var(--mincho); font-size: 15px; margin: 18px 0 4px; padding-left: 8px; border-left: 3px solid var(--kin); }
    .d-text p { margin: 0; font-size: 14px; line-height: 1.8; }
    .d-close { position: absolute; right: 12px; top: 8px; border: none; background: none; font-size: 26px; cursor: pointer; color: #7a7066; }
    mark { background: #f6e08a; padding: 0 2px; }
    footer { text-align: center; color: var(--muted); font-size: 12px; padding: 30px 20px 50px; border-top: 1px solid #332b24; }
    @media (max-width: 700px) { .d-wrap { grid-template-columns: 1fr; } }
  </style>
  <script src="js/data-loader.js"></script>
</head>
<body>
  <header>
    <a class="back" href="index.html">← お点前稽古へ戻る</a>
    <h1 id="m-title">お道具の美術館</h1>
    <p id="m-sub"></p>
  </header>
  <div id="error" hidden></div>
  <main id="rooms"></main>
  <footer>展示の説明は data/museum.js で書き直せます。「要確認」の所は、先生や教本で確かめてください。</footer>

  <dialog id="detail"></dialog>

  <!-- データ -->
  <script src="data/tools.js" data-tools></script>
  <script src="data/museum.js"></script>
  <!-- 本体 -->
  <script src="js/pixel-art.js"></script>
  <script src="js/pixel-art-side.js"></script>
  <script src="js/mihon.js"></script>
  <script src="js/museum-page.js"></script>
</body>
</html>
