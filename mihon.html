<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>重ねた道具の見本</title>
  <style>
    :root { --sumi: #2b2622; --kinari: #f3eee2; --matcha: #5f7f2a; --muted: #6e655c; }
    body { margin: 0; background: var(--kinari); color: var(--sumi);
           font-family: "Hiragino Sans", "Yu Gothic", sans-serif; }
    header { background: var(--sumi); color: var(--kinari); padding: 12px 24px; }
    header h1 { margin: 0; font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 20px; letter-spacing: .08em; }
    header p { margin: 4px 0 0; font-size: 13px; color: #cfc6b8; }
    main { padding: 20px 24px 40px; display: grid; grid-template-columns: 1fr; gap: 20px; }
    .card { background: #fffaf0; border: 1px solid #d8cfbc; border-radius: 8px; padding: 14px 18px; }
    .card.wide { grid-column: 1 / -1; }
    .card h2 { margin: 0 0 10px; font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 18px; }
    .views { display: flex; gap: 16px; flex-wrap: wrap; }
    figure { margin: 0; }
    figcaption { font-size: 12px; color: var(--muted); margin-top: 4px; }
    canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; border-radius: 4px; }
    .caps { display: flex; font-size: 13px; }
    .caps span { flex: 1; text-align: center; }
    .views { align-items: flex-end; }
    .order { font-size: 13px; margin: 10px 0 4px; }
    .order b { color: var(--matcha); font-weight: normal; }
    .note { font-size: 13px; margin: 0; line-height: 1.7; }
    mark { background: #f6e08a; padding: 0 2px; }
  </style>
</head>
<body>
  <header>
    <h1>重ねた道具の見本</h1>
    <p>上から見た絵と、亭主が点前座に座って見た絵です。どちらも亭主が手前（下）、向こうが上で、左右の位置がそろっています。</p>
  </header>
  <main id="cards"></main>

  <script src="js/pixel-art.js"></script>
  <script src="js/pixel-art-side.js"></script>
  <script src="js/mihon.js"></script>
  <script>
    // 見本の絵をカードにして並べる
    const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])).replace(/要確認/g, '<mark>要確認</mark>');
    const K = 4; // 拡大率
    function scaled(c, k = K) { c.style.width = c.width * k + 'px'; c.style.height = c.height * k + 'px'; return c; }
    Mihon.build().forEach(card => {
      const el = document.createElement('section');
      el.className = 'card' + (card.wide ? ' wide' : '');
      el.innerHTML = `<h2>${esc(card.title)}</h2><div class="views"></div>
        <p class="order">重ねる順：<b>${esc(card.order)}</b></p><p class="note">${esc(card.note)}</p>`;
      const views = el.querySelector('.views');
      card.views.forEach(([label, c, k]) => {
        const f = document.createElement('figure');
        f.appendChild(scaled(c, k));
        if (card.captions) f.insertAdjacentHTML('beforeend', `<div class="caps">${card.captions.map(t => `<span>${esc(t)}</span>`).join('')}</div>`);
        f.insertAdjacentHTML('beforeend', `<figcaption>${label}</figcaption>`);
        views.appendChild(f);
      });
      document.getElementById('cards').appendChild(el);
    });
  </script>
</body>
</html>
