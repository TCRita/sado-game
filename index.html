<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>茶の湯 お点前稽古</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- データ読み込み係（データファイルより先に読み込む） -->
  <script src="js/data-loader.js"></script>
</head>
<body>
  <header>
    <h1>茶の湯 お点前稽古 <small>裏千家</small></h1>
    <nav id="mode-tabs">
      <button data-mode="zukan" class="active">図鑑</button>
      <button data-mode="guide">ガイド付き練習</button>
      <button data-mode="honban">本番</button>
      <button data-mode="quiz">三択</button>
      <button data-mode="steps">手順一覧</button>
    </nav>
    <a class="museum-link" href="museum.html">お道具の美術館 →</a>
    <label class="temae-select">お点前：<select id="temae-select"></select></label>
  </header>

  <div id="error-banner" hidden></div>
  <div id="step-bar" hidden></div>

  <main id="main">
    <!-- 畳の画面（上から／亭主の目線） -->
    <section id="stage-wrap">
      <canvas id="view-top" class="view main"></canvas>
      <canvas id="view-host" class="view mini"></canvas>
      <button id="swap-view">亭主の目線を大きく</button>
      <div id="tooltip" hidden></div>
      <label class="label-toggle"><input type="checkbox" id="show-labels" checked> 場所の名前を表示</label>
      <div id="banner" hidden></div>
      <div id="finish" hidden></div>
      <div id="quiz-area" hidden></div>
      <div id="game-area" hidden></div>
    </section>

    <!-- 右側の説明パネル -->
    <aside id="panel"></aside>

    <!-- 手順一覧（データ確認用） -->
    <section id="steps-view" hidden></section>
  </main>

  <!-- ===== データ（ここを編集します） ===== -->
  <!-- 道具の一覧 -->
  <script src="data/tools.js" data-tools></script>
  <!-- お点前の手順。新しいお点前を足すときは、ここに1行追加します -->
  <script src="data/temae/furo_usucha_hira.js" data-temae></script>
  <script src="data/temae/ro_usucha_hira.js" data-temae></script>
  <!-- 三択の問題集 -->
  <script src="data/quiz.js"></script>
  <!-- 設定（練習用の「手順へ飛ぶ」のパスワードなど） -->
  <script src="data/settings.js"></script>

  <!-- ===== 本体のプログラム ===== -->
  <script src="js/pixel-art.js"></script>
  <script src="js/pixel-art-side.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/view-top.js"></script>
  <script src="js/view-host.js"></script>
  <script src="js/views.js"></script>
  <script src="js/zukan.js"></script>
  <script src="js/temae.js"></script>
  <script src="js/chasen-game.js"></script>
  <script src="js/quiz-mode.js"></script>
  <script src="js/steps-view.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
